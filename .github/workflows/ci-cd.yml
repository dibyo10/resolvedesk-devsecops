name: ResolveDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Test isolated backend database
        run: pytest -v
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  build-scan-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Define immutable image tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${OWNER,,}/resolvedesk-backend:$SHA" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER,,}/resolvedesk-frontend:$SHA" >> "$GITHUB_ENV"
      - name: Build images once
        run: |
          docker build --pull --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$BACKEND_IMAGE" ./backend
          docker build --pull --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$FRONTEND_IMAGE" ./frontend
      - name: Scan both images with Trivy
        run: |
          mkdir -p reports
          backend_status=0
          frontend_status=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" -v trivy-cache:/root/.cache/ aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table --output /reports/backend.txt "$BACKEND_IMAGE" || backend_status=$?
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" -v trivy-cache:/root/.cache/ aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table --output /reports/frontend.txt "$FRONTEND_IMAGE" || frontend_status=$?
          cat reports/*.txt
          test "$backend_status" -eq 0 && test "$frontend_status" -eq 0
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ github.sha }}
          path: reports/
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: resolvedesk-ci
      - uses: azure/setup-helm@v4.3.0
      - name: Load scanned images into Kubernetes
        run: |
          kind load docker-image "$BACKEND_IMAGE" "$FRONTEND_IMAGE" --name resolvedesk-ci
      - name: Deploy with Helm
        run: |
          kubectl apply -f k8s/namespace.yaml
          password=$(openssl rand -hex 24)
          kubectl create secret generic resolvedesk-database -n resolvedesk --from-literal=username=resolvedesk --from-literal=password="$password" --from-literal=DATABASE_URL="postgresql+psycopg://resolvedesk:$password@resolvedesk-postgres:5432/resolvedesk"
          helm upgrade --install resolvedesk ./helm/resolvedesk -n resolvedesk --wait --wait-for-jobs --timeout 5m --set backend.image="${BACKEND_IMAGE%:*}" --set backend.tag="$GITHUB_SHA" --set frontend.image="${FRONTEND_IMAGE%:*}" --set frontend.tag="$GITHUB_SHA" --set hpa.enabled=false
      - name: Smoke test deployed application
        run: |
          kubectl get pods,services -n resolvedesk
          kubectl port-forward -n resolvedesk service/resolvedesk-frontend 3000:80 > /tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://localhost:3000/health
          curl --fail http://localhost:3000/api/tickets
      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get pods,jobs,events -n resolvedesk || true
          kubectl logs -n resolvedesk -l app.kubernetes.io/instance=resolvedesk --all-containers --prefix --tail=100 || true
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested and scanned images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
