apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resolvedesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dibyo10/resolvedesk-devsecops.git
    targetRevision: main
    path: helm/resolvedesk
    helm:
      releaseName: resolvedesk
      valueFiles:
        - values-prod.yaml
        - values-release.yaml
      parameters:
        - name: ingress.host
          value: resolvedesk.local
  destination:
    server: https://kubernetes.default.svc
    namespace: resolvedesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
