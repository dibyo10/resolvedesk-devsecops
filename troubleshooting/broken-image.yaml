apiVersion: apps/v1
kind: Deployment
metadata: {name: resolvedesk-broken-image, namespace: resolvedesk}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: ghcr.io/example/resolvedesk-backend:does-not-exist}]
